name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: vmalgo, POSTGRES_PASSWORD: vmalgo, POSTGRES_DB: vmalgo_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vmalgo" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest fakeredis
      - name: Tests on SQLite
        run: python -m pytest -q tests
      - name: Tests on PostgreSQL
        run: python -m pytest -q tests
        env: { TEST_DATABASE_URL: "postgresql+psycopg://vmalgo:vmalgo@localhost:5432/vmalgo_test" }
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check
        env: { DATABASE_URL: "postgresql+psycopg://vmalgo:vmalgo@localhost:5432/vmalgo_test", ENV: development }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env: { NEXTAUTH_SECRET: ci-only, NEXTAUTH_URL: "http://localhost:3000" }
