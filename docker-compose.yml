name: vmalgo
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vmalgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run python scripts/init_env.py first}
      POSTGRES_DB: vmalgo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vmalgo -d vmalgo"], interval: 5s, timeout: 3s, retries: 12 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # ticks and events are transient
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 12 }

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://vmalgo:${POSTGRES_PASSWORD}@db:5432/vmalgo
      REDIS_URL: redis://redis:6379/0
      FEED_IN_API: "false"            # feed and strategy runner live in the worker
      CORS_ORIGINS: https://${DOMAIN:-localhost}
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    expose: ["8000"]

  worker:                              # tick feeder + automated strategy runner (run exactly ONE replica)
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://vmalgo:${POSTGRES_PASSWORD}@db:5432/vmalgo
      REDIS_URL: redis://redis:6379/0
    depends_on: { backend: { condition: service_healthy } }

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "", NEXT_PUBLIC_WS_URL: "" }
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: https://${DOMAIN:-localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?run python scripts/init_env.py first}
      API_INTERNAL_URL: http://backend:8000
    depends_on: [backend]
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:-localhost}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [backend, frontend]

volumes: { pgdata: {}, caddy_data: {}, caddy_config: {} }
